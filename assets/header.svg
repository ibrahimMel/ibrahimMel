<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Ibrahim Amine Melhaoui, Ingénieur Logiciel Full Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;text-anchor:middle}
    .name{font-size:42px;font-weight:700;fill:#fff;animation:fade 1s ease-out both}
    .role{font-size:20px;font-weight:500;fill:#cbd5e1;animation:fade 1s ease-out .4s both}
    .stack{font-size:16px;font-weight:500;fill:#94a3b8;animation:fade 1s ease-out .8s both}
    .bar{transform-box:fill-box;transform-origin:left;animation:grow 1.2s ease-out .3s both}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
  <rect width="900" height="200" rx="16" fill="url(#bg)"/>
  <text x="450" y="82" class="name">Ibrahim Amine Melhaoui</text>
  <rect class="bar" x="330" y="98" width="240" height="4" rx="2" fill="url(#accent)"/>
  <text x="450" y="132" class="role">Ingénieur Logiciel Full Stack</text>
  <text x="450" y="162" class="stack">Java / Spring Boot · .NET · React</text>
</svg>
